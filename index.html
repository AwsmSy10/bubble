<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>인세인 아케이드</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 10%,#194f7b,#071426 65%); font-family:system-ui,sans-serif; color:#effaff; }
    .shell { width:min(94vw,820px); text-align:center; }
    h1 { font-size:clamp(1.5rem,4vw,2.4rem); letter-spacing:.08em; margin:.4rem 0; text-shadow:0 3px #09243b; }
    p { margin:.25rem 0 .8rem; color:#bfe5ff; }
    button { margin-left:.5rem; padding:.28rem .65rem; border:1px solid #8ddcff; border-radius:6px; background:#123d5d; color:#e8f9ff; font-weight:700; cursor:pointer; }
    button:hover { background:#1c587f; }
    .inventory { margin:.7rem auto .35rem; max-width:760px; padding:.6rem .9rem; border:2px solid #8ddcff; border-radius:10px; background:rgba(7,35,58,.9); color:#fff; font-weight:700; font-size:1.05rem; line-height:1.7; }
    canvas { width:100%; aspect-ratio:21/15; display:block; border:5px solid #7ad8ff; border-radius:14px; box-shadow:0 0 0 5px #10385b,0 20px 40px #0008; background:#70c6e7; image-rendering:pixelated; }
    kbd { background:#16344b; border:1px solid #6dbce4; border-bottom-width:3px; border-radius:4px; padding:.08rem .35rem; font-family:inherit; }
    .status { min-height:1.5em; font-weight:700; color:#ffec9b; margin-top:.75rem; }
  </style>
</head>
<body>
  <main class="shell">
    <h1>🫧 인세인 아케이드</h1>
    <p><kbd>W A S D</kbd> 또는 <kbd>방향키</kbd> 이동 · <kbd>Space</kbd> 버블 설치 · <kbd>R</kbd> 다시 시작 <button id="musicToggle" type="button">BGM: 켜짐</button></p>
    <canvas id="game" width="1050" height="750" aria-label="인세인 아케이드 게임"></canvas>
    <div id="inventory" class="inventory" aria-label="아이템 현황판"></div>
    <div id="status" class="status">적을 물줄기로 잡아보세요!</div>
  </main>
<script>
(() => {
  const c=document.querySelector('#game'), ctx=c.getContext('2d'), status=document.querySelector('#status'), musicButton=document.querySelector('#musicToggle'), inventory=document.querySelector('#inventory');
  const W=21,H=15,S=50, keys=new Set(); let board,player,bots,bubbles,flames,items,webs,ended,last=0,startAt=0,audioCtx,bgmStarted=false,bgmTimer,musicEnabled=true;
  const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  function unlockAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
  function sfx(type){unlockAudio();const now=audioCtx.currentTime,settings={place:[300,520,.11,'sine'],burst:[160,65,.28,'triangle'],catch:[660,180,.3,'square'],item:[500,900,.16,'sine'],rescue:[360,620,.16,'sine'],web:[180,80,.2,'sawtooth']}[type],osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=settings[3];osc.frequency.setValueAtTime(settings[0],now);osc.frequency.exponentialRampToValueAtTime(settings[1],now+settings[2]);gain.gain.setValueAtTime(.055,now);gain.gain.exponentialRampToValueAtTime(.001,now+settings[2]);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+settings[2]);}
  function musicNote(freq,when,length,type='square',volume=.025){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(.001,when);gain.gain.exponentialRampToValueAtTime(volume,when+.015);gain.gain.exponentialRampToValueAtTime(.001,when+length);osc.connect(gain).connect(audioCtx.destination);osc.start(when);osc.stop(when+length+.02);}
  function startBgm(){if(!musicEnabled)return;unlockAudio();if(bgmStarted)return;bgmStarted=true;musicButton.textContent='BGM: 켜짐';const melody=[523,659,784,659,587,698,880,698,523,659,784,1047,880,784,659,587],bass=[131,131,165,165,147,147,110,110];const loop=()=>{if(!bgmStarted)return;const now=audioCtx.currentTime+.04;for(let i=0;i<16;i++){const beat=i*.18;musicNote(melody[i],now+beat,.14,'square',.018);if(i%2===0)musicNote(bass[(i/2)%bass.length],now+beat,.16,'triangle',.035);if(i%4===2)musicNote(1047,now+beat,.05,'sine',.009);}bgmTimer=setTimeout(loop,2880);};loop();}
  musicButton.addEventListener('click',()=>{musicEnabled=!musicEnabled;if(musicEnabled){startBgm();}else{bgmStarted=false;clearTimeout(bgmTimer);musicButton.textContent='BGM: 꺼짐';}});
  function itemLimit(type){return type==='needle'||type==='shield'||type==='kick'?1:type==='web'?3:5;}
  function useNeedle(){if(player?.alive&&player.trapped&&player.items.needle>0){player.items.needle--;player.trapped=false;player.trapAt=0;player.walk=.2;sfx('rescue');status.textContent='🪡 바늘로 물방울을 터뜨리고 탈출했어요!';}}
  function useShield(){if(player?.alive&&!player.trapped&&!player.shieldActive&&player.items.shield>0){player.items.shield--;player.shieldActive=true;player.shieldTimer=5;sfx('rescue');status.textContent='🛡️ 쉴드 활성화! 5초 동안 모든 물줄기를 막아요.';}}
  function useWeb(a){const x=Math.round(a.x),y=Math.round(a.y);if(!a?.alive||a.trapped||a.items.web<=0||webs.some(w=>w.x===x&&w.y===y))return;a.items.web--;webs.push({x,y,owner:a,armed:false});sfx('web');if(a===player)status.textContent='🕸️ 거미줄을 설치했어요! 밟은 캐릭터는 5초 동안 느려져요.';}
  addEventListener('keydown',e=>{ unlockAudio();startBgm();const k=e.key.length===1?e.key.toLowerCase():e.key; if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault(); keys.add(k); if(k===' ')place(player); if(k==='1')useNeedle(); if(k==='2')useShield(); if(k==='Control')useWeb(player); if(k==='r')init(); });
  addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));
  const inside=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
  function init(){
    board=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=> (x===0||y===0||x===W-1||y===H-1)?'wall':'empty'));
    const maps=[
      {name:'산호 미로',obstacles:[[9,2],[10,2],[11,2],[12,2],[13,2],[14,2],[13,4],[14,4],[15,4],[16,4],[17,4],[9,7],[10,7],[11,7],[12,7],[13,7],[14,7],[4,10],[5,10],[6,10],[7,10],[8,10],[13,11],[14,11],[15,11],[16,11]],crate:(x,y)=>(x*7+y*11)%3===1},
      {name:'기둥 정원',obstacles:[[9,2],[9,3],[9,4],[9,5],[9,6],[9,9],[9,10],[9,11],[9,12],[13,2],[13,3],[13,4],[13,5],[13,8],[13,9],[13,10],[13,11],[13,12],[17,5],[17,6],[17,7],[17,8],[17,9]],crate:(x,y)=>(x*5+y*9)%4===2||(x*11+y*3)%9===1},
      {name:'X자 협곡',obstacles:[[10,2],[11,3],[12,4],[13,5],[14,6],[15,7],[16,8],[17,9],[16,2],[15,3],[14,4],[13,5],[12,6],[11,7],[10,8],[9,9],[10,11],[11,11],[12,11]],crate:(x,y)=>(x*9+y*4)%4===3||(x*2+y*7)%10===0},
      {name:'별빛 요새',obstacles:[[10,3],[11,3],[12,3],[13,3],[10,4],[13,4],[10,5],[13,5],[10,6],[11,6],[12,6],[13,6],[15,9],[16,9],[17,9],[15,10],[17,10],[15,11],[16,11],[17,11]],crate:(x,y)=>(x*4+y*7)%4===1||(x*13+y*2)%9===4},
      {name:'쌍둥이 다리',obstacles:[[8,2],[8,3],[8,4],[8,5],[8,6],[8,8],[8,9],[8,10],[8,11],[8,12],[12,2],[12,3],[12,4],[12,5],[12,6],[12,7],[12,9],[12,10],[12,11],[12,12],[16,3],[17,3],[16,11],[17,11]],crate:(x,y)=>(x*6+y*5)%4===0||(x*3+y*13)%11===2},
      {name:'나선 유적',obstacles:[[11,2],[12,2],[13,2],[14,2],[14,3],[14,4],[14,5],[13,5],[12,5],[11,5],[10,5],[10,6],[10,7],[10,8],[11,8],[12,8],[13,8],[14,8],[15,8],[15,9],[15,10],[15,11],[14,11],[13,11]],crate:(x,y)=>(x*11+y*6)%5===2||(x*4+y*9)%12===3},
      {name:'번개 균열',obstacles:[[10,2],[11,2],[11,3],[12,3],[12,4],[13,4],[13,5],[14,5],[14,6],[15,6],[15,7],[16,7],[16,8],[15,9],[14,9],[14,10],[13,10],[13,11],[12,11],[12,12],[10,10],[9,11]],crate:(x,y)=>(x*8+y*3)%4===1||(x*5+y*11)%13===0}
    ],map=maps[Math.floor(Math.random()*maps.length)],obstacles=map.obstacles;
    for(const [x,y] of obstacles) board[y][x]='wall';
    const spawn={x:5,y:5},botSpawns=[[18,2],[18,12]],botSafe=[[17,2],[18,3],[17,12],[18,11]];
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++) if(board[y][x]==='empty'&&(Math.abs(x-spawn.x)>1||Math.abs(y-spawn.y)>1)&&![...botSpawns,...botSafe].some(p=>p[0]===x&&p[1]===y)&&map.crate(x,y)) board[y][x]='crate';
    player={x:spawn.x,y:spawn.y,drawX:spawn.x,drawY:spawn.y,walk:0,alive:true,trapped:false,trapAt:0,poppedAt:0,shieldActive:false,shieldTimer:0,slowUntil:0,kick:false,move:0,speed:.12,cap:1,range:2,items:{shoe:0,range:0,cap:0,needle:0,shield:0,web:0,kick:0},isAI:false,color:'#ffcf52'};
    bots=botSpawns.map(([x,y],i)=>({x,y,drawX:x,drawY:y,walk:0,alive:true,trapped:false,trapAt:0,poppedAt:0,shieldActive:false,shieldTimer:0,slowUntil:0,kick:false,speed:.23,cap:1,range:2,items:{shoe:0,range:0,cap:0,needle:0,shield:0,web:0,kick:0},isAI:true,color:i?'#9b8cff':'#ff6f91',think:.4+i*.2})); bubbles=[];flames=[];items=[];webs=[];ended=false;startAt=performance.now();status.textContent=`${map.name} · AI 적을 모두 물줄기로 잡아보세요!`;
  }
  function blocked(x,y){const cellX=Math.round(x),cellY=Math.round(y);return !inside(cellX,cellY)||cellX===0||cellY===0||cellX===W-1||cellY===H-1||board[cellY][cellX]!=='empty'||bubbles.some(b=>b.x===cellX&&b.y===cellY);}
  function kickBubble(b,dx,dy){if(b.vx||b.vy)return;b.vx=dx;b.vy=dy;b.slide=0;sfx('place');if(b.owner===player)status.textContent='🦶 물풍선을 발차기했어요!';}
  function move(a,dx,dy){const x=a.x+dx,y=a.y+dy,cellX=Math.round(x),cellY=Math.round(y),hit=bubbles.find(b=>b.x===cellX&&b.y===cellY);if(hit){if(a.kick)kickBubble(hit,Math.sign(dx),Math.sign(dy));return;}if(!blocked(x,y)){a.x=x;a.y=y;a.walk=.14;}}
  function place(a){const x=Math.round(a.x),y=Math.round(a.y);if(!a?.alive||a.trapped||ended||bubbles.filter(b=>b.owner===a).length>=a.cap||bubbles.some(b=>b.x===x&&b.y===y))return; bubbles.push({x,y,drawX:x,drawY:y,vx:0,vy:0,slide:0,owner:a,kind:a.isAI?'ai':'player',t:2.05,range:a.range});sfx('place');}
  function blast(b){sfx('burst');
    const add=(x,y)=>{flames.push({x,y,owner:b.owner,t:.58});items=items.filter(item=>item.x!==x||item.y!==y);for(const q of bubbles.filter(q=>q.x===x&&q.y===y))q.t=0;}; add(b.x,b.y);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])for(let i=1;i<=b.range;i++){let x=b.x+dx*i,y=b.y+dy*i;if(!inside(x,y)||board[y][x]==='wall')break; add(x,y); if(board[y][x]==='crate'){board[y][x]='empty';if(Math.random()<.48){const roll=Math.random(),type=roll<.26?'shoe':roll<.52?'range':roll<.75?'cap':roll<.81?'needle':roll<.87?'shield':roll<.94?'web':'kick';items.push({x,y,type});}break;}}
  }
  function danger(x,y){return flames.some(f=>f.x===x&&f.y===y)||bubbles.some(b=>{if(b.x===x&&b.y===y)return true; if(b.x===x&&Math.abs(b.y-y)<=b.range)return clearLine(b.x,b.y,x,y); if(b.y===y&&Math.abs(b.x-x)<=b.range)return clearLine(b.x,b.y,x,y); return false;});}
  function clearLine(x,y,tx,ty){let dx=Math.sign(tx-x),dy=Math.sign(ty-y);for(x+=dx,y+=dy;x!==tx||y!==ty;x+=dx,y+=dy)if(board[y][x]!=='empty')return false;return true;}
  function botAI(a,dt){if(!a.alive)return;if(a.trapped){if(a.items.needle>0){a.items.needle--;a.trapped=false;a.trapAt=0;sfx('rescue');}return;}a.think-=dt;if(a.think>0)return;a.think=a.speed+(a.slowUntil>performance.now()?.12:0);const options=[[0,-1],[0,1],[-1,0],[1,0]].filter(d=>!blocked(a.x+d[0],a.y+d[1],a));if(player.trapped){options.sort((u,v)=>Math.abs(a.x+u[0]-player.x)+Math.abs(a.y+u[1]-player.y)-(Math.abs(a.x+v[0]-player.x)+Math.abs(a.y+v[1]-player.y)));if(options.length)move(a,...options[0]);return;}const safe=options.filter(d=>!danger(a.x+d[0],a.y+d[1]));const choices=safe.length?safe:options;const target=items.reduce((best,item)=>!best||Math.abs(item.x-a.x)+Math.abs(item.y-a.y)<Math.abs(best.x-a.x)+Math.abs(best.y-a.y)?item:best,null);if(choices.length){if(target)choices.sort((u,v)=>Math.abs(a.x+u[0]-target.x)+Math.abs(a.y+u[1]-target.y)-(Math.abs(a.x+v[0]-target.x)+Math.abs(a.y+v[1]-target.y)));const d=target?choices[0]:choices[Math.floor(Math.random()*choices.length)];move(a,...d);}if(a.items.web>0&&Math.random()<.08)useWeb(a);const near=Math.abs(a.x-player.x)+Math.abs(a.y-player.y)<4;if((near||Math.random()<.12)&&!danger(a.x,a.y))place(a);}
  function collectItems(a){items=items.filter(item=>{if(Math.abs(item.x-a.x)>=.51||Math.abs(item.y-a.y)>=.51)return true;if(a.items[item.type]>=itemLimit(item.type)){if(a===player)status.textContent='이 아이템은 이미 최대 개수를 획득했어요. 아이템은 사라졌어요.';return false;}a.items[item.type]++;if(a===player)sfx('item');if(item.type==='shoe')a.speed=Math.max(.05,a.speed-.014);if(item.type==='range')a.range++;if(item.type==='cap')a.cap++;if(item.type==='kick')a.kick=true;if(item.type==='shield'&&a.isAI){a.items.shield--;a.shieldActive=true;a.shieldTimer=5;}if(a===player){if(item.type==='shoe')status.textContent='👟 신발 획득! 이동 속도가 빨라졌어요.';if(item.type==='range')status.textContent='↔ 물줄기 획득! 폭발 길이가 늘어났어요.';if(item.type==='cap')status.textContent='🫧 물풍선 획득! 한 번에 더 설치할 수 있어요.';if(item.type==='needle')status.textContent='🪡 바늘 획득! 갇혔을 때 1 키로 탈출할 수 있어요.';if(item.type==='shield')status.textContent='🛡️ 쉴드 획득! 2 키로 5초간 물줄기를 막을 수 있어요.';if(item.type==='web')status.textContent='🕸️ 거미줄 획득! Ctrl 키로 바닥에 설치할 수 있어요.';if(item.type==='kick')status.textContent='🦶 발차기 획득! 물풍선을 밀어 날릴 수 있어요.';}return false;});}
  function update(dt){if(ended)return;player.move-=dt;for(const a of [player,...bots])if(a.shieldActive){a.shieldTimer-=dt;if(a.shieldTimer<=0){a.shieldActive=false;a.shieldTimer=0;if(a===player)status.textContent='🛡️ 쉴드 효과가 끝났어요.';}}if(player.alive&&!player.trapped&&player.move<=0){for(const k of keys)if(dirs[k]){const [dx,dy]=dirs[k];move(player,dx*.5,dy*.5);player.move=player.speed+(player.slowUntil>performance.now()?.12:0);break;}}
    const glide=Math.min(1,dt*16); for(const a of [player,...bots]){a.drawX+=(a.x-a.drawX)*glide;a.drawY+=(a.y-a.drawY)*glide;a.walk=Math.max(0,a.walk-dt);}
    bots.forEach(b=>botAI(b,dt));for(const web of webs)if(!web.armed&&(!web.owner.alive||Math.abs(web.owner.x-web.x)>.51||Math.abs(web.owner.y-web.y)>.51))web.armed=true;for(const a of [player,...bots]){const web=webs.find(w=>w.armed&&a.alive&&Math.abs(w.x-a.x)<.51&&Math.abs(w.y-a.y)<.51);if(web){a.slowUntil=performance.now()+5000;webs=webs.filter(w=>w!==web);sfx('web');if(a===player)status.textContent='🕸️ 거미줄을 밟았어요! 5초 동안 속도 -2!';}}bubbles.forEach(b=>{b.t-=dt;if(b.vx||b.vy){b.slide-=dt;while(b.slide<=0){const x=b.x+b.vx,y=b.y+b.vy;if(!inside(x,y)||board[y][x]!=='empty'||bubbles.some(other=>other!==b&&other.x===x&&other.y===y)){b.vx=0;b.vy=0;b.slide=0;break;}b.x=x;b.y=y;b.slide+=.08;}}const glide=Math.min(1,dt*18);b.drawX+=(b.x-b.drawX)*glide;b.drawY+=(b.y-b.drawY)*glide;});let pending=bubbles.filter(b=>b.t<=0);while(pending.length){const b=pending.pop();if(b.exploded)continue;b.exploded=true;blast(b);for(const linked of bubbles)if(linked.t<=0&&!linked.exploded)pending.push(linked);}bubbles=bubbles.filter(b=>!b.exploded);flames.forEach(f=>f.t-=dt);flames=flames.filter(f=>f.t>0);
    collectItems(player);bots.forEach(collectItems);
    for(const a of [player,...bots])if(a.alive&&!a.trapped&&!a.shieldActive&&flames.some(f=>Math.abs(f.x-a.x)<.51&&Math.abs(f.y-a.y)<.51&&!(a.isAI&&f.owner===a))){a.trapped=true;a.trapAt=performance.now();a.walk=0;status.textContent=a===player?'물방울에 갇혔어요! 5초 안에 탈출하거나 AI가 닿기 전에 버텨야 해요!':'AI를 물방울에 가뒀어요! 가까이 가서 터뜨리세요!';}
    if(player.trapped&&bots.some(b=>b.alive&&Math.hypot(b.x-player.x,b.y-player.y)<.8)){player.trapped=false;player.alive=false;player.poppedAt=performance.now();ended=true;status.textContent='펑! AI에게 닿아 게임 종료! R 키로 다시 도전';}
    for(const b of bots)if(player.alive&&!player.trapped&&b.alive&&b.trapped&&Math.hypot(b.x-player.x,b.y-player.y)<.8){b.trapped=false;b.alive=false;b.poppedAt=performance.now();sfx('catch');status.textContent='펑! AI 물방울을 터뜨렸어요!';}
    for(const trapped of bots)if(trapped.alive&&trapped.trapped&&bots.some(other=>other!==trapped&&other.alive&&!other.trapped&&Math.hypot(other.x-trapped.x,other.y-trapped.y)<.8)){trapped.trapped=false;trapped.trapAt=0;trapped.think=.2;sfx('rescue');status.textContent='AI가 동료의 물방울을 터뜨려 구했어요!';}
    for(const a of [player,...bots])if(a.alive&&a.trapped&&performance.now()-a.trapAt>=5000){a.trapped=false;a.alive=false;a.poppedAt=performance.now();sfx('catch');status.textContent=a===player?'물방울이 5초 뒤 터졌어요! 게임 종료!':'AI 물방울이 5초 뒤 터졌어요!';}
    if(!player.alive){ended=true;if(!player.poppedAt)status.textContent='게임 종료! R 키로 다시 도전';}else if(!bots.some(b=>b.alive)){ended=true;status.textContent='승리! 모든 AI를 물방울로 잡았어요.';}
  }
  function rect(x,y,col){ctx.fillStyle=col;ctx.fillRect(x*S,y*S,S,S)}
  function draw(){ctx.clearRect(0,0,c.width,c.height); for(let y=0;y<H;y++)for(let x=0;x<W;x++){rect(x,y,(x+y)%2?'#63bddc':'#70c8e7');if(x===0||y===0||x===W-1||y===H-1||board[y][x]==='wall'){rect(x,y,'#174e71');ctx.fillStyle='#286b8d';ctx.fillRect(x*S+5,y*S+5,S-10,S-10);}else if(board[y][x]==='crate'){rect(x,y,'#bb7a38');ctx.fillStyle='#e5a655';ctx.fillRect(x*S+6,y*S+6,S-12,S-12);}}
    for(const f of flames){const progress=1-f.t/.58, x=f.x*S+25,y=f.y*S+25, radius=7+progress*19, alpha=Math.max(0,1-progress*.7);ctx.fillStyle=`rgba(218,250,255,${alpha})`;ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();ctx.fillStyle=`rgba(66,179,255,${alpha})`;ctx.beginPath();ctx.arc(x,y,Math.max(4,radius-8),0,Math.PI*2);ctx.fill();ctx.strokeStyle=`rgba(255,255,255,${Math.max(0,1-progress)*.9})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,radius+3,0,Math.PI*2);ctx.stroke();for(let i=0;i<4;i++){const angle=i*Math.PI/2+progress*2,drop=13+progress*14;ctx.fillStyle=`rgba(220,250,255,${Math.max(0,1-progress)})`;ctx.beginPath();ctx.arc(x+Math.cos(angle)*drop,y+Math.sin(angle)*drop,3,0,Math.PI*2);ctx.fill();}}
    for(const web of webs){const x=web.x*S+25,y=web.y*S+25;ctx.strokeStyle=web.armed?'#dfefff':'#8d9eae';ctx.lineWidth=2;for(let r=7;r<=18;r+=6){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();}for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*20,y+Math.sin(a)*20);ctx.stroke();}}
    for(const item of items){const bob=Math.sin(performance.now()/160+item.x)*2,x=item.x*S+25,y=item.y*S+25+bob,icon=item.type==='shoe'?'👟':item.type==='range'?'↔':item.type==='cap'?'🫧':item.type==='needle'?'🪡':item.type==='shield'?'🛡️':item.type==='web'?'🕸️':'🦶';ctx.fillStyle=item.type==='shoe'?'#ff8d46':item.type==='range'?'#7b8cff':item.type==='cap'?'#b06cff':item.type==='needle'?'#d4dde8':item.type==='shield'?'#42ba94':item.type==='web'?'#596476':'#e35b67';ctx.fillRect(x-15,y-15,30,30);ctx.fillStyle='#fff';ctx.font='22px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(icon,x,y+1);}
    for(const b of bubbles){const urgency=1+(2.05-b.t)*3,pulse=Math.sin(performance.now()/120*urgency),radius=17+pulse*1.8,x=(b.drawX??b.x)*S+25+pulse*.8,y=(b.drawY??b.y)*S+26;if(b.kind==='ai'){ctx.fillStyle='#43216f';ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8e5be7';ctx.beginPath();ctx.arc(x,y,radius-5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e5d2ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,radius-3,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(x-7,y-3,4,5);ctx.fillRect(x+3,y-3,4,5);}else{ctx.fillStyle='#167fca';ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();ctx.fillStyle='#49b7ef';ctx.beginPath();ctx.arc(x,y,radius-5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d8faff';ctx.beginPath();ctx.arc(x-6,y-7,5+pulse*.5,0,Math.PI*2);ctx.fill();}}
    for(const a of [player,...bots])if(a.alive){const x=(a.drawX??a.x)*S+25,y=(a.drawY??a.y)*S+25+(a.walk>0?Math.sin(performance.now()/38)*2:0);ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17253a';ctx.fillRect(x-9,y-5,5,6);ctx.fillRect(x+4,y-5,5,6);ctx.fillStyle='#fff';ctx.fillRect(x-8,y-5,2,2);ctx.fillRect(x+5,y-5,2,2);}
    for(const a of [player,...bots])if(a.alive&&a.slowUntil>performance.now()){const x=a.drawX*S+25,y=a.drawY*S+25,blink=Math.floor(performance.now()/120)%2===0;ctx.strokeStyle=blink?'#e17aff':'#8e32c6';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,23+Math.sin(performance.now()/65)*3,0,Math.PI*2);ctx.stroke();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 16px system-ui';ctx.fillStyle=blink?'#ffd8ff':'#c46cff';ctx.fillText('SLOW',x,y-31);}
    if(player.shieldActive&&Math.floor(performance.now()/85)%2===0){const x=player.drawX*S+25,y=player.drawY*S+25,pulse=Math.sin(performance.now()/45)*3;ctx.strokeStyle='#7fffe0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,25+pulse,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(80,255,200,.2)';ctx.beginPath();ctx.arc(x,y,25+pulse,0,Math.PI*2);ctx.fill();}
    for(const a of [player,...bots])if(a.alive&&a.trapped){const x=a.drawX*S+25,y=a.drawY*S+25,pulse=Math.sin(performance.now()/100+a.x)*2;ctx.fillStyle='rgba(101,220,255,.42)';ctx.beginPath();ctx.arc(x,y,25+pulse,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e1fbff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,25+pulse,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(x-9,y-12,5,0,Math.PI*2);ctx.fill();}
    for(const a of [player,...bots])if(a.poppedAt){const p=Math.min(1,(performance.now()-a.poppedAt)/650),x=a.drawX*S+25,y=a.drawY*S+25;ctx.fillStyle=`rgba(185,245,255,${1-p})`;ctx.beginPath();ctx.arc(x,y,12+p*38,0,Math.PI*2);ctx.fill();for(let i=0;i<8;i++){const angle=i*Math.PI/4+p*2,dist=12+p*42;ctx.fillStyle=`rgba(226,252,255,${1-p})`;ctx.beginPath();ctx.arc(x+Math.cos(angle)*dist,y+Math.sin(angle)*dist,5*(1-p)+1,0,Math.PI*2);ctx.fill();}}
    inventory.textContent=`👟 ${player.items.shoe}/5    ↔ ${player.items.range}/5    🫧 ${player.items.cap}/5    |    🪡 ${player.items.needle}/1 [1] 탈출    🛡️ ${player.items.shield}/1 [2] ${player.shieldActive?`${Math.ceil(player.shieldTimer)}초`:'쉴드'}    |    🕸️ ${player.items.web}/3 [Left Ctrl] 거미줄    🦶 ${player.kick?'발차기 ON':'발차기 없음'}${player.slowUntil>performance.now()?'  ·  SLOW!':''}`;
    const elapsed=performance.now()-startAt;ctx.textAlign='center';ctx.textBaseline='middle';if(!ended&&elapsed<1300){const alpha=Math.min(1,(1300-elapsed)/300);ctx.fillStyle=`rgba(3,24,45,${alpha*.34})`;ctx.fillRect(0,0,c.width,c.height);ctx.font='bold 86px system-ui';ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.fillText('START!',c.width/2,c.height/2);ctx.font='bold 28px system-ui';ctx.fillStyle=`rgba(191,234,255,${alpha})`;ctx.fillText('인세인 아케이드',c.width/2,c.height/2+64);}if(ended){ctx.fillStyle='rgba(3,15,31,.7)';ctx.fillRect(0,0,c.width,c.height);ctx.font='bold 82px system-ui';ctx.fillStyle=player.alive?'#fff3a2':'#ff9a9a';ctx.fillText(player.alive?'VICTORY!':'GAME OVER',c.width/2,c.height/2-24);ctx.font='bold 28px system-ui';ctx.fillStyle='#fff';ctx.fillText('R 키를 눌러 다시 시작',c.width/2,c.height/2+54);}
  }
  function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)} init();requestAnimationFrame(loop);
})();
</script>
